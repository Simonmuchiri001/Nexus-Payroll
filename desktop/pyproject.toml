[project]
name = "nexus-enterprise-desktop"
version = "0.1.0"
description = "Nexus Enterprise PyQt6 desktop client"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28.1",
  "keyring>=25.6.0",
  "pydantic>=2.10.5",
  "PyQt6>=6.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_desktop"]

[project.scripts]
nexus-desktop = "nexus_desktop.main:main"
