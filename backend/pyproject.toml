[project]
name = "nexus-api"
version = "0.1.0"
description = "Nexus Enterprise authoritative backend API"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.6",
  "psycopg[binary]>=3.2.3",
  "pwdlib[argon2]>=0.2.1",
  "pydantic>=2.10.5",
  "pydantic-settings>=2.7.1",
  "PyJWT>=2.10.1",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0.36",
  "structlog>=24.4.2",
  "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_api"]

[project.scripts]
nexus-api = "nexus_api.cli:main"
